<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block page_title %}TM Forwarder{% endblock %}</title>

  <!-- PWA Settings -->
  <meta name="theme-color" content="#0e141d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0e141d;
      --card-bg: #18222d;
      --card-inner: #212d3b;
      --text-main: #ffffff;
      --text-muted: #7f91a4;
      --accent-blue: #228be6;
      --accent-light-blue: #38bdf8;
      --border-color: rgba(255, 255, 255, 0.08);
      --red-accent: #ff6b6b;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* Top Navbar */
    .top-bar {
      background: var(--bg-color);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border-color);
    }

    .top-bar-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar-action {
      color: var(--accent-light-blue);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* Cards */
    .rule-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin: 16px;
      border: 1px solid var(--border-color);
    }

    .chat-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .chat-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      background-color: var(--card-inner);
    }

    /* Tabs */
    .nav-tabs-custom {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-color);
      margin-bottom: 20px;
    }

    .nav-tabs-custom .tab-item {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-bottom: 2px solid transparent;
    }

    .nav-tabs-custom .tab-item.active {
      color: var(--accent-light-blue);
      border-bottom-color: var(--accent-light-blue);
    }

    /* Checkbox & Switch custom */
    .form-check-input {
      background-color: var(--card-inner);
      border-color: var(--border-color);
    }

    .form-check-input:checked {
      background-color: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .form-switch .form-check-input {
      width: 2.8em;
      height: 1.5em;
    }

    /* Buttons & Floating Action */
    .btn-outline-dashed {
      border: 1px dashed var(--border-color);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-muted);
      border-radius: 25px;
      padding: 10px 20px;
      width: 100%;
      text-align: center;
      text-decoration: none;
      display: block;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .fab-btn {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background-color: #0d6efd;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      text-decoration: none;
      z-index: 999;
    }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card-inner);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  {% block content %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
