<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block page_title %}TM Forwarder{% endblock %}</title>

  <!-- PWA App Icons & Theme Color -->
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg">
  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg">

  <!-- Bootstrap 5 & Icons & Google Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #151b26;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #0088cc;
      --primary-hover: #0077b5;
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
      --accent-green: #2ea043;
      --accent-red: #da3633;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding-bottom: 80px;
      -webkit-tap-highlight-color: transparent;
    }

    /* Modern Top Bar */
    .appbar {
      background: rgba(21, 27, 38, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 14px 18px;
    }

    .appbar-title {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.3px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Cards */
    .mcard {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    /* Bottom Nav Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(21, 27, 38, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }

    .nav-item-btn {
      color: var(--text-sub);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .nav-item-btn i {
      font-size: 1.3rem;
      margin-bottom: 3px;
    }

    .nav-item-btn.active {
      color: #38bdf8;
    }

    /* UI Fixes */
    .chat-line {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid var(--card-border);
    }

    .btn-pill {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 25px;
      padding: 10px 18px;
      font-size: 0.88rem;
      font-weight: 600;
      width: 100%;
      box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
    }

    .form-control, .form-select {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: #fff !important;
      border-radius: 10px;
    }

    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.08);
      border-color: var(--primary);
      box-shadow: none;
    }
  </style>
</head>
<body>

  <!-- App Bar -->
  <div class="appbar d-flex justify-content-between align-items-center">
    {% block appbar_left %}
    <span class="appbar-title">
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" width="26" height="26" alt="Logo">
      TM Forwarder
    </span>
    {% endblock %}

    {% block appbar_actions %}{% endblock %}
  </div>

  <!-- Main Container -->
  <div class="container py-3">
    {% block content %}{% endblock %}
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <a href="/" class="nav-item-btn {% if page == 'home' %}active{% endif %}">
      <i class="bi bi-diagram-3-fill"></i>Rules
    </a>
    <a href="/dashboard" class="nav-item-btn {% if page == 'dashboard' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i>Dashboard
    </a>
    <a href="/logs" class="nav-item-btn {% if page == 'logs' %}active{% endif %}">
      <i class="bi bi-journal-code"></i>Logs
    </a>
    <a href="/settings" class="nav-item-btn {% if page == 'settings' %}active{% endif %}">
      <i class="bi bi-gear-wide-connected"></i>Settings
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
